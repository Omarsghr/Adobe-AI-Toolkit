name: Adobe AI Toolkit Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Build
        env:
          # These connect the GitHub Secrets to environment variables for the build process
          ADOBE_CLIENT_ID: ${{ ADOBE_DEVELOPER_CONSOLE }}
          ADOBE_CLIENT_SECRET: ${{ A162352719823874938}}
        run: npm run build

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adobe-toolkit-build
          path: dist/ # Ensure your build output folder is actually named 'dist'