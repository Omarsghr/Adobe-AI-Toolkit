<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Adobe AI Toolkit Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #e0e0e0;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            background: linear-gradient(90deg, #0066cc 0%, #0052a3 100%);
            padding: 12px 16px;
            border-bottom: 2px solid #0052a3;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        #header h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px;
            gap: 16px;
        }

        .control-section {
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            padding: 12px;
        }

        .control-section h3 {
            font-size: 12px;
            font-weight: 600;
            color: #00bfff;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .control-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        input[type="file"],
        input[type="text"],
        select {
            flex: 1;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 12px;
        }

        input[type="file"]::file-selector-button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }

        button {
            padding: 10px 16px;
            background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            background: linear-gradient(135deg, #0077dd 0%, #006bb8 100%);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #status-display {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            padding: 10px;
            min-height: 100px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            overflow-y: auto;
            max-height: 150px;
        }

        .status-message {
            margin: 4px 0;
            opacity: 0.8;
        }

        .status-success {
            color: #00ff00;
        }

        .status-error {
            color: #ff4444;
        }

        .status-info {
            color: #00bfff;
        }

        .status-warning {
            color: #ffaa00;
        }

        .payload-summary {
            background: #0a0a0a;
            border-left: 3px solid #0066cc;
            padding: 8px;
            border-radius: 2px;
            font-size: 10px;
            margin-top: 8px;
            line-height: 1.4;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0066cc, #00ff00);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🎬 Adobe AI Toolkit</h1>
    </div>

    <div id="main-container">
        <!-- File Selection -->
        <div class="control-section">
            <h3>📥 Select Audio</h3>
            <div class="control-group">
                <input type="file" id="audioFile" accept="audio/*" />
                <button id="previewButton">Preview</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="uploadProgress"></div>
            </div>
        </div>

        <!-- Server Configuration -->
        <div class="control-section">
            <h3>🖥️ Server Config</h3>
            <div class="control-group">
                <input type="text" id="serverHost" placeholder="Server IP (e.g., 192.168.1.100)" value="192.168.1.100" />
            </div>
            <div class="control-group">
                <input type="text" id="serverPort" placeholder="Port" value="8000" />
                <button id="testConnection">Test Connection</button>
            </div>
        </div>

        <!-- Processing Options -->
        <div class="control-section">
            <h3>⚙️ Processing Options</h3>
            <div class="control-group">
                <select id="transitionType">
                    <option value="cross_dissolve">Transition: Cross Dissolve</option>
                    <option value="fade_to_black">Transition: Fade to Black</option>
                    <option value="dip_to_white">Transition: Dip to White</option>
                    <option value="fade">Transition: Fade</option>
                </select>
            </div>
            <div class="control-group">
                <input type="text" id="vocalPadding" placeholder="Vocal Padding (seconds)" value="0.10" />
                <input type="text" id="duckingDb" placeholder="Audio Ducking (dB)" value="-12" />
            </div>
        </div>

        <!-- Main Action -->
        <div class="control-section">
            <button id="processButton" style="width: 100%; padding: 12px; font-size: 13px; font-weight: 600;">
                🚀 Process & Apply to Timeline
            </button>
        </div>

        <!-- Status Display -->
        <div class="control-section" style="flex: 1; display: flex; flex-direction: column;">
            <h3>📊 Status</h3>
            <div id="status-display"></div>
            <div class="payload-summary" id="payloadSummary" style="display: none;"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // ADOBE CEP BRIDGE & API COMMUNICATION
        // ============================================================

        const CSInterface = window.__ADOBE_EXTENDSCRIPT_TOOLKIT__ ?
                            new CSInterface() :
                            { evalScript: () => {} };

        class TimelinePayloadManager {
            constructor() {
                this.currentPayload = null;
                this.serverBase = `http://${document.getElementById('serverHost').value}:${document.getElementById('serverPort').value}`;
            }

            log(message, type = 'info') {
                const statusDisplay = document.getElementById('status-display');
                const timestamp = new Date().toLocaleTimeString();
                const msgEl = document.createElement('div');
                msgEl.className = `status-message status-${type}`;
                msgEl.textContent = `[${timestamp}] ${message}`;
                statusDisplay.appendChild(msgEl);
                statusDisplay.scrollTop = statusDisplay.scrollHeight;
            }

            async testConnection() {
                try {
                    this.log('Testing server connection...', 'info');
                    const response = await fetch(`${this.serverBase}/`, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.log(`✓ Server online: ${data.message}`, 'success');
                        return true;
                    } else {
                        this.log(`✗ Server error: ${response.status}`, 'error');
                        return false;
                    }
                } catch (error) {
                    this.log(`✗ Connection failed: ${error.message}`, 'error');
                    return false;
                }
            }

            async submitAudioJob(audioFile) {
                try {
                    this.log('Preparing audio file...', 'info');
                    const formData = new FormData();
                    formData.append('file', audioFile);

                    this.log(`Uploading ${audioFile.name}...`, 'info');
                    const response = await fetch(`${this.serverBase}/process-from-adobe`, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`Server returned ${response.status}`);
                    }

                    const data = await response.json();
                    this.log('✓ Processing complete', 'success');

                    this.currentPayload = data.data;
                    this.displayPayloadSummary();

                    return data.data;
                } catch (error) {
                    this.log(`✗ Upload failed: ${error.message}`, 'error');
                    return null;
                }
            }

            displayPayloadSummary() {
                if (!this.currentPayload) return;

                const summary = this.currentPayload;
                const config = summary.project_configuration || {};
                const timeline = summary.timeline_data || {};

                let summaryHTML = `
                    <strong>📋 Payload Summary:</strong><br>
                    FPS: ${config.target_sequence_fps || 'N/A'}<br>
                    Vocal Padding: ${config.global_vocal_padding_seconds || 'N/A'}s<br>
                    <strong>Timeline:</strong><br>
                    • Dead air zones: ${(timeline.cuts_and_trims || []).length}<br>
                    • Vocal segments: ${(timeline.video_track_1_vocals || []).length}<br>
                    • B-roll images: ${(timeline.video_track_2_b_roll_images || []).length}<br>
                    • Music beds: ${(timeline.audio_track_2_music_beds || []).length}
                `;

                const payloadSummary = document.getElementById('payloadSummary');
                payloadSummary.innerHTML = summaryHTML;
                payloadSummary.style.display = 'block';
            }

            async applyTimelineChanges() {
                if (!this.currentPayload) {
                    this.log('✗ No payload loaded. Process audio first.', 'error');
                    return;
                }

                this.log('Applying timeline changes via ExtendScript...', 'info');

                // Serialize the payload for ExtendScript
                const payloadJSON = JSON.stringify(this.currentPayload);

                // Call the ExtendScript function
                const jsxCode = `
                    var payloadString = '${payloadJSON.replace(/'/g, "\\'")}';
                    var payload = JSON.parse(payloadString);
                    applyScreenplayToTimeline(payload);
                `;

                try {
                    CSInterface.evalScript(jsxCode, (result) => {
                        if (result && result.includes('Success')) {
                            this.log('✓ Timeline updated successfully', 'success');
                        } else {
                            this.log(`✗ ExtendScript error: ${result}`, 'error');
                        }
                    });
                } catch (error) {
                    this.log(`✗ ExtendScript execution failed: ${error.message}`, 'error');
                }
            }
        }

        const payloadManager = new TimelinePayloadManager();

        // ============================================================
        // UI EVENT HANDLERS
        // ============================================================

        document.getElementById('serverHost').addEventListener('change', () => {
            payloadManager.serverBase = `http://${document.getElementById('serverHost').value}:${document.getElementById('serverPort').value}`;
        });

        document.getElementById('serverPort').addEventListener('change', () => {
            payloadManager.serverBase = `http://${document.getElementById('serverHost').value}:${document.getElementById('serverPort').value}`;
        });

        document.getElementById('testConnection').addEventListener('click', () => {
            payloadManager.testConnection();
        });

        document.getElementById('previewButton').addEventListener('click', () => {
            const file = document.getElementById('audioFile').files[0];
            if (file) {
                payloadManager.log(`Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`, 'info');
            } else {
                payloadManager.log('No file selected', 'warning');
            }
        });

        document.getElementById('processButton').addEventListener('click', async () => {
            const audioFile = document.getElementById('audioFile').files[0];
            if (!audioFile) {
                payloadManager.log('Select an audio file first', 'warning');
                return;
            }

            document.getElementById('processButton').disabled = true;
            const progress = document.getElementById('uploadProgress');
            progress.style.width = '0%';

            const result = await payloadManager.submitAudioJob(audioFile);

            if (result) {
                progress.style.width = '100%';
                payloadManager.applyTimelineChanges();
            }

            document.getElementById('processButton').disabled = false;
        });

        // Initialize
        window.addEventListener('load', () => {
            payloadManager.log('Panel initialized. Ready for audio processing.', 'success');
        });
    </script>
</body>
</html>
